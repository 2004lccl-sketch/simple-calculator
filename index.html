<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易四则运算计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .calculator {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 24px;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            color: #666;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus {
            border-color: #667eea;
        }
        .op-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .op-btn {
            padding: 12px;
            border: 1px solid #e0e0e0;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .op-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .op-btn:hover {
            background: #eef0ff;
        }
        .op-btn.active:hover {
            background: #5568d3;
        }
        .calc-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .calc-btn:hover {
            background: #5568d3;
        }
        .result-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .result-box.error {
            background: #fff0f0;
            color: #d32f2f;
        }
        .result-text {
            font-size: 20px;
            font-weight: 500;
            color: #333;
        }
        .history {
            border-top: 1px solid #eee;
            padding-top: 16px;
        }
        .history h3 {
            font-size: 15px;
            color: #666;
            margin-bottom: 10px;
        }
        .history-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 14px;
            color: #555;
        }
        .history-item {
            padding: 6px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .clear-history {
            margin-top: 10px;
            padding: 6px 12px;
            background: none;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            color: #888;
        }
        .clear-history:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>简易四则运算计算器</h1>
        
        <div class="input-group">
            <label>第一个数字</label>
            <input type="number" id="num1" placeholder="请输入数字">
        </div>

        <div class="op-buttons">
            <button class="op-btn active" data-op="+">+</button>
            <button class="op-btn" data-op="-">−</button>
            <button class="op-btn" data-op="*">×</button>
            <button class="op-btn" data-op="/">÷</button>
        </div>

        <div class="input-group">
            <label>第二个数字</label>
            <input type="number" id="num2" placeholder="请输入数字">
        </div>

        <button class="calc-btn" onclick="calculate()">计算结果</button>

        <div class="result-box" id="resultBox">
            <span class="result-text" id="resultText">请输入数字后点击计算</span>
        </div>

        <div class="history">
            <h3>计算历史</h3>
            <div class="history-list" id="historyList"></div>
            <button class="clear-history" onclick="clearHistory()">清空记录</button>
        </div>
    </div>

    <script>
        let currentOp = '+';
        let history = [];

        // 运算符按钮切换
        document.querySelectorAll('.op-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentOp = btn.dataset.op;
            });
        });

        // 回车键快捷计算
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Enter') calculate();
            });
        });

        // 核心计算功能（保留C++原程序逻辑）
        function calculate() {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            if(isNaN(num1) || isNaN(num2)) {
                resultBox.classList.add('error');
                resultText.textContent = '错误：请输入有效的数字';
                return;
            }

            let result;
            let opSymbol = currentOp;

            switch(currentOp) {
                case '+':
                    result = num1 + num2;
                    opSymbol = '+';
                    break;
                case '-':
                    result = num1 - num2;
                    opSymbol = '−';
                    break;
                case '*':
                    result = num1 * num2;
                    opSymbol = '×';
                    break;
                case '/':
                    if(num2 === 0) {
                        resultBox.classList.add('error');
                        resultText.textContent = '错误：不能除以0';
                        return;
                    }
                    result = num1 / num2;
                    opSymbol = '÷';
                    break;
            }

            resultBox.classList.remove('error');
            const expression = `${num1} ${opSymbol} ${num2} = ${result}`;
            resultText.textContent = expression;
            addToHistory(expression);
        }

        // 历史记录功能
        function addToHistory(expression) {
            history.unshift(expression);
            if(history.length > 10) history.pop();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = history.map(item => `<div class="history-item">${item}</div>`).join('');
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }
    </script>
</body>
</html>
